<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='640' viewBox='0 0 1180 640'>
<defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<rect width='1180' height='640' fill='white'/>
<text x='24' y='34' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='700' fill='#1f2933' text-anchor='start'>pipecat-trainer: any Pipecat bot becomes a trainable system</text>
<text x='24' y='54' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>daytime: the bot takes calls and every turn is captured · nighttime: rollouts, training, a gate, and a promotion the bot never notices</text>
<rect x='24' y='72' width='548' height='236' rx='12' fill='#f7f8fa' stroke='#9aa5b1' stroke-width='1' stroke-dasharray='6 4'/>
<text x='36' y='90' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#8a94a6' text-anchor='start'>DAYTIME  ·  production calls</text>
<rect x='604' y='72' width='552' height='236' rx='12' fill='#f7f8fa' stroke='#9aa5b1' stroke-width='1' stroke-dasharray='6 4'/>
<text x='616' y='90' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#8a94a6' text-anchor='start'>NIGHTTIME  ·  rollouts and the gate</text>
<text x='40' y='132' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#1f2933' text-anchor='start'>browser / phone</text>
<polyline points='40,140 40,160 60,160' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<rect x='60' y='104' width='300' height='110' rx='10' fill='#e8f1fb' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='72' y='126' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>Pipecat bot  (yours, unchanged)</text>
<text x='72' y='146' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>STT → Smart Turn → [ LLM slot ] → TTS</text>
<text x='72' y='162' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>tools, Flows, transport as before</text>
<text x='72' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>line 1: polyvoice_llm(session_id, base_url=proxy)</text>
<text x='72' y='194' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>line 2: PolyvoiceObserver(session_id, path)</text>
<rect x='392' y='104' width='164' height='110' rx='10' fill='#fff4d6' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='404' y='126' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>traces/*.jsonl</text>
<text x='404' y='146' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>one record per turn:</text>
<text x='404' y='162' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>context, reply, tool calls,</text>
<text x='404' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>interrupted, TTFB, usage,</text>
<text x='404' y='194' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>end reason</text>
<polyline points='360,190 392,190' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<text x='376' y='182' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>observer</text>
<text x='60' y='240' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>every LLM request carries  X-Session-Id  (the join key)  and  X-Turn-Type: main | speculative</text>
<polyline points='210,214 210,340' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<text x='222' y='290' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>chat completions</text>
<rect x='616' y='104' width='250' height='96' rx='10' fill='#fde8e8' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='628' y='126' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>scenarios/pool  (Pipecat YAML)</text>
<text x='628' y='146' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>persona · goal · success · metrics</text>
<text x='628' y='162' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>pipecat-trainer rollout: K calls each,</text>
<text x='628' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>one bot process per call, -t eval</text>
<rect x='890' y='104' width='250' height='96' rx='10' fill='#fde8e8' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='902' y='126' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>scenarios/holdout  (frozen)</text>
<text x='902' y='146' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>the loop never trains on it</text>
<text x='902' y='162' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>gate: candidate vs incumbent,</text>
<text x='902' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>paired per scenario, bootstrap CI</text>
<text x='616' y='226' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>caller + judge = any OpenAI-compatible endpoint with tool calling (gemma on General Compute, Coval, …)</text>
<text x='616' y='244' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>the bot's replies come from the model being trained; the judge's reasons become the hints</text>
<polyline points='741,200 741,340' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<text x='753' y='290' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>reward + hint</text>
<polyline points='1015,200 1015,340' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<text x='1027' y='290' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>receipt</text>
<rect x='60' y='340' width='300' height='96' rx='10' fill='#fff4d6' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='72' y='362' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>polyloop proxy  (OpenAI-compatible URL)</text>
<text x='72' y='382' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>records every turn token-exact by session</text>
<text x='72' y='398' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>serves the live adapter; /admin/serve overrides</text>
<text x='72' y='414' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>promotion = flip here, no bot restart</text>
<rect x='604' y='340' width='552' height='96' rx='10' fill='#f3eefc' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='616' y='362' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>polyloop cycle</text>
<text x='616' y='382' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>filter (rollouts under the incumbent) → train → gate → propose → promote</text>
<text x='616' y='398' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>train: OPSD on captured sessions with judge hints (default),</text>
<text x='616' y='414' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>GRPO / SFT / any algorithm SkyRL supports, through rlcli</text>
<polyline points='604,388 360,388' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<text x='482' y='380' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>serve(policy): which adapter answers</text>
<rect x='60' y='470' width='1096' height='78' rx='10' fill='#e9f7ef' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='72' y='492' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2933' text-anchor='start'>rlcli serve  ·  SkyRL Tinker server on your GPU node (Modal, Lambda, own box)</text>
<text x='72' y='512' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>trainer: Megatron LoRA (PhoneLLM alpha 1 by default; any open model)      sampler: vLLM with multi-adapter slots      adapters are small, per deployment, versioned</text>
<polyline points='210,436 210,470' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<text x='222' y='458' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>sample</text>
<polyline points='880,436 880,470' fill='none' stroke='#1f2933' stroke-width='1.4' marker-end='url(#a)'/>
<text x='892' y='458' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>train step / save adapter</text>
<text x='24' y='588' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>Tiers: 0 Pipecat Evals text mode (free) · 1 audio mode (Kokoro, Moonshine) · 2 a simulation vendor as the gate · 3 production via observer or proxy</text>
<text x='24' y='606' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>Nothing in the bot changes between a training night and a promotion: the adapter flips behind the proxy URL.</text>
</svg>