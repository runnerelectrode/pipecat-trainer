<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='470' viewBox='0 0 1180 470'>
<defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f2933'/></marker></defs>
<rect width='1180' height='470' fill='white'/>
<text x='24' y='34' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='700' fill='#1f2933' text-anchor='start'>The loop, by category of the stack, and what Pipecat provides at each step</text>
<rect x='24' y='46' width='14' height='14' rx='3' fill='#e8f1fb' stroke='#9aa5b1'/>
<text x='44' y='57' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>the voice agent (Pipecat)</text>
<rect x='324' y='46' width='14' height='14' rx='3' fill='#fff4d6' stroke='#9aa5b1'/>
<text x='344' y='57' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>this package</text>
<rect x='624' y='46' width='14' height='14' rx='3' fill='#f3eefc' stroke='#9aa5b1'/>
<text x='644' y='57' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>the training stack (any TITO proxy, trainer, gate)</text>
<rect x='24' y='84' width='350' height='118' rx='12' fill='#e8f1fb' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='38' y='110' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2933' text-anchor='start'>1 · Voice agent</text>
<text x='38' y='132' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>takes real calls: STT → turn detection → LLM → TTS</text>
<text x='38' y='148' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>the LLM is an OpenAI-compatible endpoint</text>
<rect x='38' y='168' width='322' height='22' rx='6' fill='white' stroke='#9aa5b1' stroke-width='0.8'/>
<text x='46' y='183' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#1c4e80' text-anchor='start'>Pipecat: the whole bot, unchanged</text>
<rect x='414' y='84' width='350' height='118' rx='12' fill='#fff4d6' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='428' y='110' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2933' text-anchor='start'>2 · Capture</text>
<text x='428' y='132' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>TITO proxy records every turn token-exact by session;</text>
<text x='428' y='148' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>an observer records context, tools, interruptions, latency</text>
<rect x='428' y='168' width='322' height='22' rx='6' fill='white' stroke='#9aa5b1' stroke-width='0.8'/>
<text x='436' y='183' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#1c4e80' text-anchor='start'>Pipecat: LLM service class + observer API</text>
<rect x='804' y='84' width='350' height='118' rx='12' fill='#fff4d6' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='818' y='110' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2933' text-anchor='start'>3 · Sandbox + evals  (the verifier)</text>
<text x='818' y='132' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>scenarios run against the bot; a simulated caller talks,</text>
<text x='818' y='148' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>a judge scores each call and explains what went wrong</text>
<rect x='818' y='168' width='322' height='22' rx='6' fill='white' stroke='#9aa5b1' stroke-width='0.8'/>
<text x='826' y='183' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#1c4e80' text-anchor='start'>Pipecat: the eval harness (or a vendor like Coval)</text>
<polyline points='374,143 414,143' fill='none' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='394' y='133' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>every LLM request</text>
<polyline points='764,143 804,143' fill='none' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='784' y='133' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>session ids</text>
<rect x='804' y='270' width='350' height='118' rx='12' fill='#f3eefc' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='818' y='296' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2933' text-anchor='start'>4 · Trainer</text>
<text x='818' y='318' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>rows = recorded turn + judge's explanation as the hint</text>
<text x='818' y='334' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>on-policy self-distillation by default; GRPO, SFT also</text>
<rect x='414' y='270' width='350' height='118' rx='12' fill='#fff4d6' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='428' y='296' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2933' text-anchor='start'>5 · Gate</text>
<text x='428' y='318' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>candidate vs incumbent on a frozen holdout set,</text>
<text x='428' y='334' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>paired, confidence interval, regression cap → receipt</text>
<rect x='428' y='354' width='322' height='22' rx='6' fill='white' stroke='#9aa5b1' stroke-width='0.8'/>
<text x='436' y='369' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#1c4e80' text-anchor='start'>Pipecat: the same eval harness replays the holdout</text>
<rect x='24' y='270' width='350' height='118' rx='12' fill='#f3eefc' stroke='#9aa5b1' stroke-width='1.2'/>
<text x='38' y='296' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#1f2933' text-anchor='start'>6 · Promote</text>
<text x='38' y='318' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>a passing receipt flips the adapter behind the endpoint;</text>
<text x='38' y='334' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#52606d' text-anchor='start'>the bot restarts nothing and takes the next call</text>
<rect x='38' y='354' width='322' height='22' rx='6' fill='white' stroke='#9aa5b1' stroke-width='0.8'/>
<text x='46' y='369' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#1c4e80' text-anchor='start'>Pipecat: same endpoint, same bot</text>
<polyline points='979,202 979,270' fill='none' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='990' y='240' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>reward + reasons, per call</text>
<polyline points='804,329 764,329' fill='none' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='784' y='319' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>candidate</text>
<polyline points='414,329 374,329' fill='none' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='394' y='319' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='middle'>receipt</text>
<polyline points='199,270 199,202' fill='none' stroke='#1f2933' stroke-width='1.6' marker-end='url(#a)'/>
<text x='210' y='240' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>next day's calls run on the winner (recursive)</text>
<text x='24' y='424' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>Simplest reading: Pipecat is the agent and the eval harness. This package is the two lines that capture calls and the driver that turns evals into</text>
<text x='24' y='440' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='start'>rollouts. Everything below the line is a standard training stack: a token-in/token-out proxy, a trainer that supports OPSD/GRPO/SFT, and a gate.</text>
</svg>